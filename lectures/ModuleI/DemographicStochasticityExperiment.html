## Demographic Stochasticity

.pull-left-60[


.large[
- ***Stochasticity*** means: **Randomness** in **time**.  

- ***Demography*** is the **Science of Population Dynamics**.  Specifically: **births** and **deaths** (and **movements** ... but we're still looking at closed population). 

Individually, *all* demographic processes are stochastic.  

- An individual has some *probability* of dying at any moment.  
- An individual has some *probability* of reproducing at a given time.
]
]

.pull-left-60.large[

## Human Experiment: Process A, N₀ = 5


- Groups of .yellow[**7**;] N₀ = .red[**5 standing**]

- Flip a survival coin.  

  - If **TAILS** - you're dead (sit down), 
  - if **HEADS** - you live! (stay standing)
  
- Flip **one** reproduction coin.  

  - If **HEADS** - call on another student to stand!
  (congrats on your new baby! 🎈🎉)

- Record until **extinction** or 20 generations

- 8 minutes (as many replicates as you can)

***Enter data at QR code or here:*** https://tinyurl.com/527v7afd 
]
